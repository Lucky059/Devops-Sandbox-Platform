events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    log_format main '$time_iso8601 | $status | ${request_time}s | $remote_addr | $request';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;

        # API control plane
        location /api/ {
            proxy_pass http://sandbox-api:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default response for unknown routes
        location / {
            return 404 '{"error":"environment not found","hint":"use /api/envs to list active environments"}';
            add_header Content-Type application/json;
        }

        # Per-environment routes are included from conf.d/
        include /etc/nginx/conf.d/*.conf;
    }
}
