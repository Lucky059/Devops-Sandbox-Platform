version: "3.8"

services:

  # ── Nginx — public front door ──────────────────────────
  nginx:
    image: nginx:latest
    container_name: sandbox-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - sandbox-net
    restart: unless-stopped

  # ── Control API — wraps all shell scripts ──────────────
  api:
    image: python:3.11-alpine
    container_name: sandbox-api
    working_dir: /app
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - API_PORT=${API_PORT:-5000}
    ports:
      - "5000:5000"
    networks:
      - sandbox-net
    command: >
      sh -c "pip install flask requests -q &&
             python platform/api.py"
    restart: unless-stopped
    depends_on:
      - nginx

  # ── Health Monitor ─────────────────────────────────────
  monitor:
    image: python:3.11-alpine
    container_name: sandbox-monitor
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - sandbox-net
    command: >
      sh -c "pip install requests -q &&
             python monitor/poller.py"
    restart: unless-stopped
    depends_on:
      - nginx

networks:
  sandbox-net:
    driver: bridge
    name: sandbox-net
