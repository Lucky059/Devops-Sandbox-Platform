
services:

  # ── Nginx — public front door ──────────────────────────
  nginx:
    image: nginx:latest
    container_name: sandbox-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - sandbox-net
    restart: unless-stopped

  # ── Control API — wraps all shell scripts ──────────────
  api:
    image: python:3.11-alpine
    container_name: sandbox-api
    working_dir: /app
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - API_PORT=${API_PORT:-5000}
    ports:
      - "5000:5000"
    networks:
      - sandbox-net
    command: >
      sh -c "pip install flask requests -q &&
             python platform/api.py"
    restart: unless-stopped
    depends_on:
      - nginx

  # ── Health Monitor ─────────────────────────────────────
  monitor:
    image: python:3.11-alpine
    container_name: sandbox-monitor
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - sandbox-net
    command: >
      sh -c "pip install requests -q &&
             python monitor/poller.py"
    restart: unless-stopped
    depends_on:
      - nginx

  # ── Prometheus — metrics collector ────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sandbox-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - sandbox-net
    restart: unless-stopped
    depends_on:
      - nginx

  # ── Grafana — metrics dashboard ────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sandbox-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - sandbox-net
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  sandbox-net:
    driver: bridge
    name: sandbox-net
    external: false